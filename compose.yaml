services:
  postgres:
    image: postgres:18.4
    ports:
      - '127.0.0.1:55432:5432'
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in the root .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the root .env}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in the root .env}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test:
        ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 2s
      timeout: 5s
      retries: 30
    restart: 'no'

volumes:
  postgres_data:
